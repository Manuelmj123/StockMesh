services:
  api:
    build:
      context: ../../../apps/api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      SYMMETRIC_DB_HOST: mysql-central
      SYMMETRIC_DB_PORT: 3306
      SYMMETRIC_DB_USER: root
      SYMMETRIC_DB_PASSWORD: root
      SYMMETRIC_DB_NAME: stockmesh_central
      SYMMETRIC_POLL_INTERVAL_MS: 5000
      REALTIME_HUB_BASE_URL: http://realtime-hub:5000
      REALTIME_HUB_INTERNAL_API_KEY: stockmesh-dev-key
      SYMMETRIC_NODE_CONTAINERS: '{"000":"api-stack-symmetricds-central-1","001":"api-stack-symmetricds-store-001-1"}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      realtime-hub:
        condition: service_started
      rabbitmq:
        condition: service_started
      mysql-central:
        condition: service_started
      symmetricds-central:
        condition: service_started
      symmetricds-store-001:
        condition: service_started

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mysql-central:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockmesh_central
    ports:
      - "3307:3306"
    volumes:
      - mysql-central-data:/var/lib/mysql
      - ../../mysql-init/central:/docker-entrypoint-initdb.d

  mysql-store-001:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockmesh_store_001
    ports:
      - "3309:3306"
    volumes:
      - mysql-store-001-data:/var/lib/mysql
      - ../../mysql-init/store-001:/docker-entrypoint-initdb.d

  symmetric-prepare:
    image: jumpmind/symmetricds
    depends_on:
      mysql-central:
        condition: service_started
      mysql-store-001:
        condition: service_started
    volumes:
      - ../../symmetricds/central/engines/central-000.properties:/opt/symmetric-ds/engines/central-000.properties:ro
      - ../../symmetricds/store-001/engines/store-001.properties:/opt/symmetric-ds/engines/store-001.properties:ro
      - ../../bootstrap/prepare-symmetric.sh:/bootstrap/prepare-symmetric.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap/prepare-symmetric.sh"]
    restart: "no"

  symmetric-bootstrap:
    image: mysql:8.4
    depends_on:
      mysql-central:
        condition: service_started
      symmetric-prepare:
        condition: service_completed_successfully
    volumes:
      - ../../bootstrap:/bootstrap
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap-symmetric.sh"]
    restart: "no"

  symmetricds-central:
    image: jumpmind/symmetricds
    ports:
      - "31415:31415"
    volumes:
      - ../../symmetricds/central/engines:/opt/symmetric-ds/engines
      - ../../symmetricds/central/logs:/opt/symmetric-ds/logs
    depends_on:
      mysql-central:
        condition: service_started
      symmetric-prepare:
        condition: service_completed_successfully
      symmetric-bootstrap:
        condition: service_completed_successfully

  symmetricds-store-001:
    image: jumpmind/symmetricds
    ports:
      - "31416:31415"
    volumes:
      - ../../symmetricds/store-001/engines:/opt/symmetric-ds/engines
      - ../../symmetricds/store-001/logs:/opt/symmetric-ds/logs
    depends_on:
      mysql-store-001:
        condition: service_started
      symmetric-prepare:
        condition: service_completed_successfully
      symmetric-bootstrap:
        condition: service_completed_successfully
      symmetricds-central:
        condition: service_started

  realtime-hub:
    build:
      context: ../../../apps/realtime-hub
    ports:
      - "5001:5000"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ASPNETCORE_ENVIRONMENT: Development
      MonitorSettings__InternalApiKey: stockmesh-dev-key
      Cors__Origins__0: http://localhost:5173

volumes:
  rabbitmq-data:
  mysql-central-data:
  mysql-store-001-data: