services:
  api:
    build:
      context: ../../../apps/api
    ports:
      - "3000:3000"
    depends_on:
      - rabbitmq
      - symmetricds
      - mysql

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockmesh
    ports:
      - "3307:3306"

  symmetricds:
    image: jumpmind/symmetricds
    ports:
      - "31415:31415"
    volumes:
      - ../../symmetricds/engines:/opt/symmetric-ds/engines
      - ../../symmetricds/logs:/opt/symmetric-ds/logs
    depends_on:
      - mysql