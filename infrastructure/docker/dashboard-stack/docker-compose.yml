services:
  dashboard-web:
    build:
      context: ../../../apps/dashboard-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      VITE_SIGNALR_BASE_URL: http://localhost:5001
    depends_on:
      - dashboard-mysql

  dashboard-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockmesh_dashboard
    ports:
      - "3308:3306"